<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Personal Expense Tracker</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/3.9.1/chart.min.js"></script>
     <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="container">
        <header>
            <h1>💰 Personal Expense Tracker</h1>
            <p>Track your income and expenses efficiently</p>
        </header>

        <div class="main-content">
          
            <div class="summary-cards">
                <div class="card balance">
                    <h3>Current Balance</h3>
                    <div class="amount" id="balance">₹0.00</div>
                </div>
                <div class="card income">
                    <h3>Total Income</h3>
                    <div class="amount" id="income">₹0.00</div>
                </div>
                <div class="card expense">
                    <h3>Total Expense</h3>
                    <div class="amount" id="expense">₹0.00</div>
                </div>
            </div>

           
            <div class="form-section">
                <h2>Add New Transaction</h2>
                <div class="error-message" id="error-message"></div>
                <div class="success-message" id="success-message"></div>
                
                <form id="transaction-form">
                    <div class="form-grid">
                        <div class="form-group">
                            <label for="description">Description *</label>
                            <input type="text" id="description" placeholder="e.g., Grocery shopping" required>
                        </div>
                        <div class="form-group">
                            <label for="amount">Amount *</label>
                            <input type="number" id="amount" placeholder="0.00" step="0.01" min="0.01" required>
                        </div>
                        <div class="form-group">
                            <label for="type">Type *</label>
                            <select id="type" required>
                                <option value="expense">Expense</option>
                                <option value="income">Income</option>
                            </select>
                        </div>
                        <div class="form-group">
                            <label for="category">Category *</label>
                            <select id="category" required>
                                <option value="">Select Category</option>
                            </select>
                        </div>
                    </div>
                    <div class="button-group">
                        <button type="submit" class="btn-primary">Add Transaction</button>
                        <button type="button" class="btn-danger" id="clear-all">Clear All Data</button>
                    </div>
                </form>
            </div>

         
            <div class="content-grid">
               
                <div class="transactions-section">
                    <h2>Transaction History</h2>
                    <div class="filter-controls">
                        <select id="filter-type">
                            <option value="all">All Transactions</option>
                            <option value="income">Income Only</option>
                            <option value="expense">Expense Only</option>
                        </select>
                        <select id="filter-category">
                            <option value="all">All Categories</option>
                        </select>
                    </div>
                    <ul id="transaction-list"></ul>
                </div>

            
                <div class="chart-section">
                    <h2>Expense Distribution</h2>
                    <div class="chart-container">
                        <canvas id="category-chart"></canvas>
                    </div>
                </div>
            </div>
        </div>
    </div>

   <script src="script.js"></script>
</body>
</html>
